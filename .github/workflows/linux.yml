name: Build Linux

# A real Linux build: `.deb` and AppImage, downloadable as an artifact.
#
# This started as a compile probe — the engine has a WebKitGTK adapter in
# `crates/drift-engine/src/platform/linux`, but CI had never compiled app code
# on Linux, so whether it still built was unknown. It does (commit 555fabbc).
#
# What this build is NOT: the assistant is compiled out on Linux
# (`work_provider.rs` gates the lead on macOS and Windows), and nobody has run
# this on a real desktop yet. Treat it as a browser you can try, not a release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "-> target"

      - name: Install frontend deps
        working-directory: frame
        run: npm install --no-audit --no-fund

      - name: Install desktop deps
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # `tauri build` runs `npm --prefix ../frame run build` itself, so the
      # frontend is not built separately here.
      #
      # Deb and AppImage only: `bundle.targets` is "all", and rpm would need
      # `rpmbuild` installed for a format nobody asked for.
      - name: Build the app
        working-directory: desktop
        run: npx tauri build --bundles deb,appimage

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: drift-linux
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      - name: Report
        if: success()
        run: |
          {
            echo "Linux build produced:"
            ls -lh target/release/bundle/deb/*.deb \
                   target/release/bundle/appimage/*.AppImage
            echo
            echo "The assistant is compiled out on Linux; this is the browser."
          } >> "$GITHUB_STEP_SUMMARY"
