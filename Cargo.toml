[workspace]
resolver = "2"
members = ["crates/*", "desktop", "xtask"]
exclude = [
    "vendor/adblock",
    "vendor/tao",
    "vendor/tauri",
    "vendor/tauri-runtime-wry",
    "vendor/tauri-plugin-updater",
    "vendor/wry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["crynta"]
repository = "https://github.com/drift/drift"

[workspace.dependencies]
drift-agentic = { path = "crates/drift-agentic", version = "=0.1.0" }
drift-decision = { path = "crates/drift-decision", version = "=0.1.0" }
drift-agent-model-catalog = { path = "crates/drift-agent-model-catalog", version = "=0.1.0" }
drift-agent-runtime = { path = "crates/drift-agent-runtime", version = "=0.1.0" }
drift-agent-provider-transport = { path = "crates/drift-agent-provider-transport", version = "=0.1.0" }
drift-agent-controller = { path = "crates/drift-agent-controller", version = "=0.1.0" }
drift-blocker = { path = "crates/drift-blocker", version = "=0.1.0", default-features = false }
drift-blocker-service = { path = "crates/drift-blocker-service", version = "=0.1.0", default-features = false }
drift-blocker-update = { path = "crates/drift-blocker-update", version = "=0.1.0", default-features = false }
drift-account = { path = "crates/drift-account", version = "=0.1.0" }
drift-core = { path = "crates/drift-core", version = "=0.1.0" }
drift-credentials = { path = "crates/drift-credentials", version = "=0.1.0" }
drift-ipc = { path = "crates/drift-ipc", version = "=0.1.0" }
drift-engine = { path = "crates/drift-engine", version = "=0.1.0" }
drift-notes = { path = "crates/drift-notes", version = "=0.1.0" }
drift-import = { path = "crates/drift-import", version = "=0.1.0" }
drift-private-fs = { path = "crates/drift-private-fs", version = "=0.1.0" }
drift-store = { path = "crates/drift-store", version = "=0.1.0" }
drift-voice = { path = "crates/drift-voice", version = "=0.1.0" }
drift-update-transport = { path = "crates/drift-update-transport", version = "=0.1.0", default-features = false }
drift-app = { path = "crates/drift-app", version = "=0.1.0" }
drift-work-composition = { path = "crates/drift-work-composition", version = "=0.1.0" }
drift-page-assist = { path = "crates/drift-page-assist", version = "=0.1.0" }

tauri = { version = "=2.11.3", features = ["macos-private-api"] }
tauri-build = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
wry = "=0.55.1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
crc32fast = "=1.5.0"
ring = "=0.17.14"
thiserror = "2"
ulid = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
crossbeam-queue = "=0.3.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
proptest = "1"
tempfile = "3"
tough = { version = "=0.24.0", default-features = false }

# These native-boundary crates start from the exact upstream revisions recorded
# alongside their source. Keeping the surgical adapters in-tree makes Tauri
# construction policy and Wry's callback, prompt, teardown, profile, and Linux
# process-isolation policy reproducible without relying on mutable forks.
[patch.crates-io]
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
adblock = { path = "vendor/adblock" }
tao = { path = "vendor/tao" }
tauri = { path = "vendor/tauri" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
wry = { path = "vendor/wry" }

[profile.release]
# Browser chrome should fail terminally on an invariant violation instead of
# attempting to unwind through native WebView/Objective-C/COM callbacks.
panic = "abort"
# Keep the native shell small without giving up whole-program optimization.
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
# Bounds checks remain enabled independently; retain integer overflow checks
# as well so release builds do not silently wrap security/resource counters.
overflow-checks = true
