[package]
name = "drift-work-composition"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
durable-runtime = ["native-work", "dep:serde_json", "dep:sha2", "dep:drift-core", "dep:drift-ipc", "drift-app/work-runtime", "dep:tokio", "dep:drift-page-assist"]
native-work = ["dep:drift-app", "dep:drift-engine", "dep:drift-store", "dep:drift-agent-controller", "dep:drift-agent-provider-transport", "dep:drift-agentic"]
macos-work = ["native-work"]
public-qualification = [
    "macos-work",
    "drift-app/work-execution-probe",
    "drift-agent-provider-transport/probe-harness",
]
navigation-qualification = ["macos-work", "dep:drift-agentic", "dep:drift-core", "dep:drift-agent-runtime"]
discovery-qualification = ["navigation-qualification", "public-qualification"]
# Content-free original-resource failure evidence; never selects a task.
retained-lifetime-diagnostic = ["public-qualification", "drift-engine/native-agentic-work-lifetime-diagnostic"]
retained-product-qualification = ["navigation-qualification", "retained-lifetime-diagnostic"]
# A compile-time-only objective selection on the same retained product entry.
retained-commerce-qualification = ["retained-product-qualification"]
retained-action-qualification = ["retained-product-qualification", "drift-agentic/probe-harness"]
retained-back-qualification = ["retained-product-qualification", "drift-agentic/probe-harness"]
retained-notion-qualification = ["retained-product-qualification"]
retained-notion-write-qualification = ["retained-product-qualification"]
retained-qualification = ["public-qualification", "drift-engine/native-agentic-work-resource-probe", "dep:drift-agentic", "dep:drift-core", "dep:drift-agent-runtime"]
retained-public-qualification = ["retained-qualification", "drift-engine/native-agentic-public-resource-probe"]

[dependencies]
serde_json = { workspace = true, optional = true }
sha2 = { version = "=0.10.9", optional = true }
drift-ipc = { workspace = true, optional = true }
drift-page-assist = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
drift-app = { workspace = true, optional = true, features = ["work-execution"] }
drift-engine = { workspace = true, optional = true, features = ["agentic-browser"] }
drift-store = { workspace = true, optional = true, features = ["work-execution"] }
drift-agent-controller = { workspace = true, optional = true, features = ["provider-transport"] }
drift-agent-provider-transport = { workspace = true, optional = true }
drift-agentic = { workspace = true, optional = true }
drift-agent-runtime = { workspace = true, optional = true }
drift-core = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
